<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; font-family: var(--font-text); background: var(--surface-card); padding:24px; box-sizing:border-box; }
  .group { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:18px; }
  .lbl { font-family:var(--font-display); font-weight:700; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); width:100%; margin-bottom:-4px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Badge, Avatar } = window.TOTVSDesignSystem_be3538;
    const I = ({n}) => <i className={"ph ph-"+n} />;
    function Demo(){
      return (
        <div>
          <div className="group">
            <span className="lbl">Buttons</span>
            <Button variant="primary">Começar agora</Button>
            <Button variant="cyan" iconRight={<I n="arrow-right"/>}>Falar com a TOTVS</Button>
            <Button variant="secondary" iconLeft={<I n="plus"/>}>Adicionar</Button>
            <Button variant="ghost">Cancelar</Button>
            <Button variant="primary" disabled>Indisponível</Button>
          </div>
          <div className="group">
            <Button variant="cyan" size="sm">Pequeno</Button>
            <Button variant="cyan" size="md">Médio</Button>
            <Button variant="cyan" size="lg">Grande</Button>
          </div>
          <div className="group">
            <span className="lbl">Badges & avatars</span>
            <Badge tone="success" dot>Ativo</Badge>
            <Badge tone="cyan" emphasis="solid">Novo</Badge>
            <Badge tone="purple">Beta</Badge>
            <Badge tone="warning">Pendente</Badge>
            <Badge tone="danger" emphasis="solid">Atrasado</Badge>
            <Avatar name="Ana Lima" tone="cyan" />
            <Avatar name="Rafael Souza" tone="purple" />
            <Avatar name="TO TVS" tone="navy" ring />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
