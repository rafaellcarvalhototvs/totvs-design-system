<!-- @dsCard group="15 Slides — Fundos & fechamento" viewport="1280x720" name="Fundo colorido — Azul Escuro" subtitle="Full-color statement slide (navy) — white text, cyan highlight, cropped 3D grafismo" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="slide.css">
<style>
  .slide.bgc { background: var(--totvs-dark); background-image: radial-gradient(130% 120% at 16% 28%, #012c3c 0%, var(--totvs-dark) 52%, #00111c 100%); overflow: hidden; }
  .bgc .graf { position: absolute; right: -220px; top: 6%; width: 1120px; height: 1120px; background: url('../assets/grafismo/grafismo-teal.png') center/contain no-repeat; opacity: .88; z-index: 1; }
  .bgc .pad { padding: 50px 64px; position: relative; z-index: 2; }
  .bgc h1 { font-family: var(--font-display); font-weight: 800; font-size: 42px; letter-spacing: -.02em; margin: 0; color: #fff; }
  .bgc .sub { font-family: var(--font-text); font-size: 21px; color: #fff; margin: 6px 0 0; opacity: .9; }
  .bgc .massa { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1.16; letter-spacing: -.02em;
    color: #fff; max-width: 15ch; margin: 64px 0 0; text-wrap: balance; }
  .bgc .massa .hl { color: var(--totvs-cyan); }
</style>
</head>
<body>
  <div class="slide bgc">
    <div class="graf"></div>
    <div class="pagemark on-dark"><span class="n">90</span><img src="../assets/totvs-symbol-white.svg" alt=""></div>
    <div class="pad">
      <h1>Slide com fundo colorido Azul Escuro</h1>
      <p class="sub">Complete a informação neste espaço</p>
      <p class="massa">Massa de texto, dolor amet lore consectetuer amet adipisc elit, sed diam nonummy <span class="hl">nibh morq euismod tincidunt utrich urly.</span></p>
    </div>
  </div>
</body>
</html>
