<!-- @dsCard group="12 Slides — Abertura & agenda" viewport="1280x720" name="Aberturas — imagens aprovadas" subtitle="Approved photography library for cover & section-divider openings" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="slide.css">
<style>
  .slide.aprov { background: var(--totvs-dark); background-image: radial-gradient(130% 120% at 18% 14%, #012c3c 0%, var(--totvs-dark) 55%, #00111c 100%); color: #fff; overflow: hidden; }
  .aprov .pad { padding: 40px 56px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
  .aprov .ovl { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--totvs-cyan); margin: 0; }
  .aprov h1 { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -.01em; margin: 4px 0 0; }
  .aprov .sub { font-size: 15px; color: var(--navy-300); margin: 6px 0 20px; max-width: 70ch; }
  .aprov .sub b { color: #fff; font-weight: 600; }
  .aprov .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 12px; flex: 1; min-height: 0; }
  .aprov .ph { position: relative; border-radius: 8px; overflow: hidden; background: #0a2230; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .aprov .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .aprov .ph.wide { grid-column: span 2; }
  .aprov .tag { position: absolute; left: 8px; bottom: 7px; display: flex; align-items: center; gap: 5px; background: rgba(0,18,28,.7); border-radius: 999px; padding: 3px 9px 3px 6px; font-family: var(--font-display); font-weight: 700; font-size: 10px; color: #fff; backdrop-filter: blur(2px); }
  .aprov .tag i { width: 11px; height: 11px; border-radius: 50%; background: var(--totvs-cyan); display: flex; align-items: center; justify-content: center; color: var(--totvs-dark); font-size: 8px; line-height: 1; }
</style>
</head>
<body>
  <div class="slide aprov">
    <div class="pagemark on-dark"><span class="n">·</span><img src="../assets/totvs-symbol-white.svg" alt=""></div>
    <div class="pad">
      <p class="ovl">Fotografia · Aberturas</p>
      <h1>Imagens aprovadas</h1>
      <p class="sub">Banco de imagens <b>aprovado pelo time de marca</b> para uso em capas e divisórias de seção. Selecione áreas de baixa complexidade visual para posicionar logo e texto com bom contraste.</p>
      <div class="grid">
        <div class="ph wide"><img src="../assets/aberturas/abertura-01.opt.jpg" alt="Abertura aprovada — equipe caminhando no escritório"><span class="tag"><i>✓</i>Aprovada</span></div>
        <div class="ph"><img src="../assets/aberturas/abertura-02.opt.jpg" alt="Abertura aprovada — profissional com tablet"></div>
        <div class="ph"><img src="../assets/aberturas/abertura-03.opt.jpg" alt="Abertura aprovada — profissional sorrindo"></div>
        <div class="ph"><img src="../assets/aberturas/abertura-05.opt.jpg" alt="Abertura aprovada — dois profissionais com tablet"></div>
        <div class="ph"><img src="../assets/aberturas/abertura-06.opt.jpg" alt="Abertura aprovada — equipe diversa"><span class="tag"><i>✓</i>Aprovada</span></div>
        <div class="ph"><img src="../assets/aberturas/abertura-09.opt.jpg" alt="Abertura aprovada — mulher com grafismo"></div>
        <div class="ph"><img src="../assets/aberturas/abertura-10.opt.jpg" alt="Abertura aprovada — executivo e arquitetura"></div>
        <div class="ph"><img src="../assets/aberturas/abertura-12.opt.jpg" alt="Abertura aprovada — jovem com laptop"></div>
        <div class="ph"><img src="../assets/aberturas/abertura-13.opt.jpg" alt="Abertura aprovada — análise de dados à noite"></div>
        <div class="ph"><img src="../assets/aberturas/abertura-15.opt.jpg" alt="Abertura aprovada — planeta Terra"></div>
        <div class="ph"><img src="../assets/aberturas/abertura-16.opt.jpg" alt="Abertura aprovada — reunião de equipe"></div>
      </div>
    </div>
  </div>
</body>
</html>
