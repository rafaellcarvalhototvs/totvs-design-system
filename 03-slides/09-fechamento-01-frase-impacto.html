<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="slide.css">
<style>
  .slide.impacto { background: var(--totvs-cyan); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .rings { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-around; padding: 0 40px; z-index: 1; }
  .rings .r { width: 360px; height: 360px; background: url('../assets/grafismo/grafismo-navy.png') center/contain no-repeat; }
  .impacto h1 { position: relative; z-index: 2; font-family: var(--font-display); font-weight: 800; font-size: 86px;
    letter-spacing: -.03em; color: #fff; margin: 0; text-align: center; text-shadow: 0 6px 30px rgba(0,18,28,.35); }
</style>
</head>
<body>
  <div class="slide impacto">
    <div class="rings"><div class="r"></div><div class="r"></div><div class="r"></div></div>
    <div class="pagemark"><span class="n">31</span><img src="../assets/totvs-symbol.svg" alt=""></div>
    <h1>Frase curta de impacto</h1>
  </div>
</body>
</html>
