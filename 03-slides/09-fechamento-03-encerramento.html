<!-- @dsCard group="15 Slides — Fundos & fechamento" viewport="1280x720" name="Encerramento" subtitle="Obrigado(a) — apresentador, redes sociais, grafismo final & logo" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="slide.css">
<style>
  .slide.end { background: var(--totvs-dark); color: #fff; overflow: hidden; }
  .end .pad { padding: 64px 72px; justify-content: flex-start; position: relative; z-index: 2; }
  .end .title { font-size: 80px; line-height: .98; margin: 0; }
  .badge { width: 84px; height: 84px; margin: 22px 0 30px; border-radius: 50%; background: var(--totvs-cyan);
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .badge img { width: 80px; height: 80px; display: block; }
  .pres { font-family: var(--font-display); font-weight: 700; font-size: 28px; color: var(--totvs-cyan); margin: 0; letter-spacing: -.01em; }
  .role { font-size: 16px; color: #fff; margin: 10px 0 0; line-height: 1.5; }
  .role a { color: #fff; }
  /* social grid */
  .social { position: absolute; left: 72px; bottom: 44px; display: grid; grid-template-columns: auto auto; gap: 18px 48px; width: max-content; z-index: 3; }
  .si { display: flex; align-items: center; gap: 15px; font-family: var(--font-display); font-weight: 600; font-size: 18px; color: #fff; }
  .si img { height: 52px; width: auto; display: block; }
  .si .circle { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
  .si .circle svg { width: 34px; height: 34px; display: block; }
  .hashtag { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; color: var(--totvs-cyan); z-index: 3; }
  /* big final grafismo on the right */
  .graf-final {
    position: absolute; right: -340px; top: 50%; transform: translateY(-50%);
    width: 1040px; height: 1040px;
    background: url('../assets/grafismo/grafismo-slidefinal-grande.png') center/contain no-repeat;
    z-index: 1;
  }
  .logo-final { position: absolute; right: 120px; bottom: 76px; height: 56px; z-index: 4; }
</style>
</head>
<body>
  <div class="slide end">
    <div class="graf-final"></div>

      </div>
    </div>
    <div class="hashtag">#SOMOSTOTVS</div>
    <img class="logo-final" src="../assets/sf-logototvs.svg" alt="TOTVS">
  </div>
</body>
</html>
