<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="slide.css">
<style>
  .slide.bgc { background: var(--totvs-orange); overflow: hidden; }
  .bgc .graf { position: absolute; right:-160px;top:6%;width:1080px;height:1080px; background: url('../assets/grafismo/grafismo-navy.png') center/contain no-repeat; z-index: 1; }
  .bgc .pad { padding: 50px 64px; position: relative; z-index: 2; }
  .bgc h1 { font-family: var(--font-display); font-weight: 800; font-size: 42px; letter-spacing: -.02em; margin: 0; color: #fff; }
  .bgc .sub { font-family: var(--font-text); font-size: 21px; color: #fff; margin: 6px 0 0; opacity: .92; }
  .bgc .massa { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1.16; letter-spacing: -.02em;
    color: #fff; max-width: 15ch; margin: 64px 0 0; text-wrap: balance; }
  .massa em{font-style:normal;color:var(--totvs-lime);}
</style>
</head>
<body>
  <div class="slide bgc">
    <div class="graf"></div>
    <div class="pagemark on-dark"><span class="n">28</span><img src="../assets/totvs-symbol-white.svg" alt=""></div>
    <div class="pad">
      <h1>Slide com fundo colorido Laranja</h1>
      <p class="sub">Complete a informação neste espaço</p>
      <p class="massa"><em>Massa de texto,</em> dolor amet lore consectetuer amet adipisc elit, sed diam nonummy nibh morq euismod tincidunt utrich.</p>
    </div>
  </div>
</body>
</html>
