<!-- @dsCard group="05 Fundamentos — Tipografia" viewport="700x230" name="Text — Verdana" subtitle="System/body font per the manual — websafe, set at 1.5 line-height" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-text); background: var(--surface-card); padding:24px 28px; box-sizing:border-box; color:var(--text-body); }
  h4 { font-family:var(--font-text); font-weight:700; font-size:16px; color:var(--text-strong); margin:0 0 8px; }
  p { font-size:14px; line-height:1.55; margin:0 0 10px; max-width:60ch; }
  .meta { font-size:11px; color:var(--text-muted); margin-top:6px; }
</style>
</head>
<body>
  <h4>Verdana Bold — títulos de apoio e ênfase</h4>
  <p>Sua operação precisa de mais previsibilidade. A TOTVS ajuda a integrar dados, automatizar processos e acompanhar indicadores em tempo real.</p>
  <p class="meta">Verdana / Verdana Bold · body 15px · long-form 1.55 · whole words in institutional contexts ("para", not "pra").</p>
</body>
</html>
