<!-- @dsCard group="05 Fundamentos — Tipografia" viewport="700x230" name="Display — TOTVS" subtitle="Institutional typeface, ExtraBold, tight tracking, sentence case" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-display); background: var(--surface-card); padding:24px 28px; box-sizing:border-box; color:var(--text-strong); }
  .big { font-weight:800; font-size:58px; line-height:1.0; letter-spacing:-0.02em; margin:0; }
  .sub { font-weight:600; font-size:22px; letter-spacing:-0.01em; margin:14px 0 0; color:var(--text-body); }
  .meta { font-family:var(--font-text); font-size:11px; color:var(--text-muted); margin-top:18px; line-height:1.5; }
  em { color:var(--totvs-cyan); font-style:normal; }
</style>
</head>
<body>
  <p class="big">Resultado <em>responsável</em></p>
  <p class="sub">A gente conecta gestão, dados e tecnologia.</p>
  <p class="meta">TOTVS · tipografia oficial · ExtraLight 200 · Light 300 · Regular 400 · SemiBold 600 · Bold 700 · ExtraBold 800. Títulos: ExtraBold, tracking −0.02em. Possui caracteres alternativos para uso pontual.</p>
</body>
</html>
