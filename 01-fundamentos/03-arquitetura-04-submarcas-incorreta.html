<!-- @dsCard group="03 Fundamentos — Arquitetura de marcas" viewport="760x340" name="Submarcas — aplicação incorreta" subtitle="Never create logos for products — sub-brands map only to business units" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-text); background:var(--surface-card); color:var(--text-strong);
    padding:30px 34px; box-sizing:border-box; display:flex; flex-direction:column; gap:18px; }
  .overline { font-family:var(--font-display); font-weight:700; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--status-danger); }
  h1 { font-family:var(--font-display); font-weight:800; font-size:25px; letter-spacing:-.02em; margin:4px 0 6px; }
  .lead { font-size:13px; line-height:1.6; color:var(--text-body); margin:0; max-width:60ch; }
  .lead b { color:var(--text-strong); font-weight:700; }
  .map { background:var(--grey-100); border-radius:var(--radius-md); padding:24px; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center; flex:1; }
  .map img { max-width:60%; max-height:120px; object-fit:contain; }
</style>
</head>
<body>
  <div>
    <div class="overline">Submarcas · Não faça</div>
    <h1>Aplicação incorreta</h1>
    <p class="lead"><b>Nunca crie logos para produtos.</b> As submarcas representam apenas nossas unidades de negócio — e também não devem receber novos logos criados.</p>
  </div>
  <div class="map"><img src="../assets/social/submarcas-incorreta.png" alt="Exemplo incorreto — logo criado para produto"></div>
</body>
</html>
