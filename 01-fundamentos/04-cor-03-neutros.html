<!-- @dsCard group="04 Fundamentos — Cores" viewport="700x180" name="Neutrals & text" subtitle="Navy-tinted dark ramp + cool light greys for text and surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-text); background: var(--surface-card); padding:18px; box-sizing:border-box; }
  .label { font-family:var(--font-display); font-weight:700; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); margin:0 0 7px; }
  .row { display:flex; gap:0; height:44px; border-radius:var(--radius-sm); overflow:hidden; margin-bottom:14px; }
  .c { flex:1; display:flex; align-items:flex-end; padding:5px 7px; font-size:9px; }
</style>
</head>
<body>
  <p class="label">Dark navy ramp</p>
  <div class="row">
    <div class="c" style="background:var(--navy-900);color:#fff">900</div>
    <div class="c" style="background:var(--navy-800);color:#fff">800</div>
    <div class="c" style="background:var(--navy-700);color:#fff">700</div>
    <div class="c" style="background:var(--navy-600);color:#fff">600</div>
    <div class="c" style="background:var(--navy-500);color:#fff">500</div>
    <div class="c" style="background:var(--navy-400);color:#fff">400</div>
    <div class="c" style="background:var(--navy-300);color:var(--totvs-dark)">300</div>
  </div>
  <p class="label">Light grey ramp</p>
  <div class="row" style="box-shadow:inset 0 0 0 1px var(--border-subtle)">
    <div class="c" style="background:var(--grey-50);color:var(--text-muted)">50</div>
    <div class="c" style="background:var(--grey-100);color:var(--text-muted)">100</div>
    <div class="c" style="background:var(--grey-200);color:var(--text-muted)">200</div>
    <div class="c" style="background:var(--grey-300);color:var(--text-body)">300</div>
    <div class="c" style="background:var(--grey-400);color:#fff">400</div>
    <div class="c" style="background:var(--grey-500);color:#fff">500</div>
    <div class="c" style="background:var(--grey-600);color:#fff">600</div>
  </div>
</body>
</html>
