<!-- @dsCard group="02 Fundamentos — Logo" viewport="700x220" name="Logo lockup" subtitle="Symbol + wordmark, on light and on dark navy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-text); display:grid; grid-template-columns:1fr 1fr; height:220px; }
  .panel { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .light { background:var(--surface-card); }
  .dark { background:var(--totvs-dark); }
  img { height:46px; }
  .cap { font-family:var(--font-display); font-weight:700; font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="panel light">
    <img src="../assets/totvs-logo.svg" alt="TOTVS logo">
    <span class="cap" style="color:var(--text-muted)">Positiva · sobre claro</span>
  </div>
  <div class="panel dark">
    <img src="../assets/totvs-logo-white.svg" alt="TOTVS logo white">
    <span class="cap" style="color:var(--navy-300)">Negativa · sobre escuro</span>
  </div>
</body>
</html>
