<!-- @dsCard group="05 Fundamentos — Tipografia" viewport="700x300" name="Type scale" subtitle="Display → caption, with role, size & font" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-text); background: var(--surface-card); padding:20px 28px; box-sizing:border-box; color:var(--text-strong); }
  .r { display:flex; align-items:baseline; gap:16px; padding:6px 0; border-bottom:1px solid var(--border-subtle); }
  .r:last-child { border-bottom:0; }
  .spec { font-size:25px; line-height:1.2; }
  .disp { font-family:var(--font-display); }
  .meta { font-family:var(--font-text); font-size:11px; color:var(--text-muted); margin-left:auto; white-space:nowrap; }
</style>
</head>
<body>
  <div class="r"><span class="spec disp" style="font-weight:800;letter-spacing:-.02em;font-size:34px">Display</span><span class="meta">TOTVS ExtraBold · 60–76px</span></div>
  <div class="r"><span class="spec disp" style="font-weight:700;font-size:27px">Heading 1</span><span class="meta">TOTVS Bold · 36px</span></div>
  <div class="r"><span class="spec disp" style="font-weight:700;font-size:22px">Heading 2</span><span class="meta">TOTVS Bold · 28px</span></div>
  <div class="r"><span class="spec disp" style="font-weight:600;font-size:18px">Heading 3</span><span class="meta">TOTVS SemiBold · 22px</span></div>
  <div class="r"><span class="spec" style="font-size:15px;color:var(--text-body)">Body — Verdana regular</span><span class="meta">Verdana · 15px</span></div>
  <div class="r"><span class="spec disp" style="font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">Overline</span><span class="meta">TOTVS Bold · 11px · tracked</span></div>
</body>
</html>
