<!-- @dsCard group="03 Fundamentos — Arquitetura de marcas" viewport="880x470" name="Submarcas — grid construtivo" subtitle="Construction grid for sub-brand lockups — x spacing, y cap height" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-text); background:var(--surface-card); color:var(--text-strong);
    display:grid; grid-template-columns:1fr 1.1fr; height:470px; }
  .content { padding:32px 34px; box-sizing:border-box; display:flex; flex-direction:column; }
  .overline { font-family:var(--font-display); font-weight:700; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--text-muted); }
  h1 { font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:-.02em; margin:4px 0 12px; }
  .lead { font-size:13px; line-height:1.6; color:var(--text-body); margin:0; max-width:44ch; }
  .lead b { color:var(--text-strong); font-weight:700; }
  .map { background:var(--grey-100); display:flex; align-items:center; justify-content:center; padding:22px; box-sizing:border-box; }
  .map img { max-width:100%; max-height:100%; object-fit:contain; }
</style>
</head>
<body>
  <div class="content">
    <div class="overline">Submarcas</div>
    <h1>Grid construtivo</h1>
    <p class="lead">Cada lockup de submarca segue uma relação construtiva que garante o espaçamento e as proporções corretas entre símbolo, logotipo e o nome da unidade — definidos pelas medidas <b>x</b> (espaçamento) e <b>y</b> (altura).</p>
  </div>
  <div class="map"><img src="../assets/social/submarcas-grid.png" alt="Grid construtivo das submarcas TOTVS"></div>
</body>
</html>
