<!-- @dsCard group="01 Fundamentos — Marca" viewport="860x360" name="Qualidades da marca" subtitle="Brand qualities that steer the visual style — Dinâmica leads photography" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-text); background:var(--surface-card); color:var(--text-strong);
    padding:26px 30px; box-sizing:border-box; }
  .overline { font-family:var(--font-display); font-weight:700; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  .row { display:grid; grid-template-columns:230px 1fr 200px; gap:24px; align-items:center;
    padding:16px 0; border-top:1px solid var(--border-subtle); }
  .row:first-of-type { border-top:0; }
  .q { font-family:var(--font-display); font-weight:800; font-size:38px; letter-spacing:-.02em; line-height:1; margin:0; }
  .desc { font-size:14px; line-height:1.5; color:var(--text-body); margin:0; }
  .lead { font-size:13px; line-height:1.45; color:var(--brand-accent); margin:0; }
  .row.primary { background:var(--purple-soft); margin:0 -14px; padding:16px 14px; border-radius:var(--radius-md); border-top:0; }
</style>
</head>
<body>
  <div class="overline">Qualidades</div>
  <div class="row primary">
    <p class="q">Dinâmica</p>
    <p class="desc">Em movimento. Inconformada. Viva. Inovadora. Sem ser inconsequente.</p>
    <p class="lead">Principal qualidade para nortear o estilo fotográfico.</p>
  </div>
  <div class="row">
    <p class="q">Colaborativa</p>
    <p class="desc">Parceira. Acessível. Atenta ao outro e ao processo. Sem perder agilidade.</p>
    <span></span>
  </div>
  <div class="row">
    <p class="q">Resolutiva</p>
    <p class="desc">Eficiente. Objetiva. Prática. Sem atropelar.</p>
    <span></span>
  </div>
</body>
</html>
