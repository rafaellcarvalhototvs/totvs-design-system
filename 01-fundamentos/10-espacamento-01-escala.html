<!-- @dsCard group="10 Fundamentos — Espaçamento & elevação" viewport="700x170" name="Spacing scale" subtitle="8pt rhythm with 4pt half-steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-text); background: var(--surface-card); padding:22px 28px; box-sizing:border-box; }
  .row { display:flex; align-items:flex-end; gap:16px; height:90px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background:var(--totvs-cyan); border-radius:3px; width:100%; }
  .swatch { width:var(--w); }
  .num { font-family:var(--font-display); font-weight:700; font-size:12px; color:var(--text-strong); }
  .px { font-size:10px; color:var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><span class="num">1</span><span class="px">4</span></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><span class="num">2</span><span class="px">8</span></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><span class="num">3</span><span class="px">12</span></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><span class="num">4</span><span class="px">16</span></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><span class="num">6</span><span class="px">24</span></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><span class="num">8</span><span class="px">32</span></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><span class="num">12</span><span class="px">48</span></div>
    <div class="item"><div class="bar" style="width:64px;height:64px"></div><span class="num">16</span><span class="px">64</span></div>
  </div>
</body>
</html>
